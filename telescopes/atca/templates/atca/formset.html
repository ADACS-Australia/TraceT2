{{ formset.management_form }}

{% for form in formset %}
    {% partialdef atca inline %}
        <fieldset id="atca-telescope" class="telescope" data-formset-prefix="{{ formset.prefix }}">
            <legend>ATCA</legend>
            {{ form }}
        </fieldset>
    {% endpartialdef atca %}
{% endfor %}

{% with form=formset.empty_form %}
    <template id="atca-telescope-template">{% partial atca %}</template>
{% endwith %}
